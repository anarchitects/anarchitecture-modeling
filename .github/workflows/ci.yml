name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # Only main may access the environment containing the shared-cache write token.
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cloud-main' || 'nx-cloud-pr' }}
      deployment: false
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.NX_CLOUD_ACCESS_TOKEN || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && secrets.NX_CLOUD_READ_ONLY_TOKEN || '' }}
      # Forks and Dependabot receive no Actions secrets; retain local validation.
      NX_NO_CLOUD: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Affected needs historical trees after checkout removes credentials.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI authentication configuration
        run: node tools/ci/verify-auth.mjs

      - run: corepack enable

      # Cache Yarn downloads; Nx task caching is separate. See docs/ci.md.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - run: yarn install --immutable

      # A lookup failure must widen verification, never fall back to HEAD~1.
      - name: Find affected comparison
        id: shas
        uses: nrwl/nx-set-shas@v5.1.0
        continue-on-error: true
        with:
          main-branch-name: main
          workflow-id: ci.yml
          last-successful-event: push
          lookup-strategy: per-commit
          error-on-no-successful-workflow: true
          set-environment-variables-for-job: false

      - name: Verify CI selection and graph policy
        run: |
          node --test tools/ci/*.test.mjs
          yarn nx graph --file=tmp/ci-project-graph.json
          node tools/ci/check-project-graph.mjs tmp/ci-project-graph.json

      - name: Verify commit lifecycle and release policy
        run: |
          node tools/release/check-commits.mjs tmp/ci-project-graph.json
          node --test tools/release/*.test.mjs

      - name: Validate affected projects or all projects
        env:
          COMPARISON_STATUS: ${{ steps.shas.outcome }}
          COMPARISON_BASE: ${{ steps.shas.outputs.base }}
          COMPARISON_HEAD: ${{ steps.shas.outputs.head }}
        run: node tools/ci/validate.mjs

      - name: Verify publishing authorization and deterministic private archives
        env:
          NX_NO_CLOUD: 'true'
        run: |
          node --test tools/publishing/*.test.mjs
          node tools/publishing/verify-archives.mjs

      - run: yarn nx fix-ci
        if: ${{ !cancelled() && env.NX_NO_CLOUD != 'true' }}
