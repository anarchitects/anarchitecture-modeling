name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # Only main may access the environment containing the shared-cache write token.
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cloud-main' || 'nx-cloud-pr' }}
      deployment: false
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'push' && secrets.NX_CLOUD_ACCESS_TOKEN || github.event_name == 'pull_request' && secrets.NX_CLOUD_READ_ONLY_TOKEN || '' }}
      # Forks and Dependabot receive no Actions secrets; retain local validation.
      NX_NO_CLOUD: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI authentication configuration
        if: env.NX_NO_CLOUD != 'true'
        run: |
          if [ -z "$NX_CLOUD_ACCESS_TOKEN" ]; then
            echo "::error::The Nx Cloud token for this CI trust level is missing. See docs/ci.md."
            exit 1
          fi

      - run: corepack enable

      # Cache Yarn downloads; Nx task caching is separate. See docs/ci.md.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - run: yarn install --immutable

      # Broad scaffold validation until #10 establishes package targets/affected selection.
      - run: yarn nx run-many -t lint test build typecheck

      - run: yarn nx fix-ci
        if: ${{ !cancelled() && env.NX_NO_CLOUD != 'true' }}
